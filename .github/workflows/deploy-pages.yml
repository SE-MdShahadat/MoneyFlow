# Builds the Angular app and publishes it to GitHub Pages.
# The API is not hosted here; set the repository variable MONEYFLOW_API_URL
# (Settings → Secrets and variables → Actions → Variables) to the API's public HTTPS address.
# People can also change the address from the app's sign-in screen.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx ng build --configuration production

      - name: Write runtime config
        env:
          API_URL: ${{ vars.MONEYFLOW_API_URL }}
        run: |
          node -e "require('fs').writeFileSync('dist/frontend/browser/config.js', 'window.MONEYFLOW_CONFIG = ' + JSON.stringify({ apiUrl: process.env.API_URL || '' }) + ';\n')"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
